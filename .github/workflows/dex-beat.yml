# DEX-BEAT — לב-הענן של הבורסה (Task 33)
#
# השרשרת הקנונית של SAOS-DEX ממשיכה לפעום מהענן של GitHub, בלי-סנדבוקס
# ובלי-שרת-אמה: כל-ריצה טוענת את תמונת-המצב מהריפו, מריצה טיקים
# דטרמיניסטיים (אותם-שערים — busy/halted/integrity), מזכה הפקדות
# שאומתו מול-הספר-הציבורי, מבצע-commit לריפו ומפרסמת את המצב ל-Console
# (Pages) לציבור. הריפו הוא הבית — הענן הוא הבונה.
#
# תדירות: כל-שעתיים (מכבת-Actions של-ריפו-פרטי נשמרת בכנות; ההרצות
# הקיימות של-הלבבות נמדדו קצרות). אפשר להפעיל ידנית בכל-רגע.

name: dex-beat

on:
  # R71 (2026-09-21, ריבונות המכסה): הקדנס הוסר — התאום הציבורי ב-Domain
  # (dex-beat :53, דקות Actions בלתי-מוגבלות) הוא המכונה. המקור הזה — גיבוי
  # להזנקה ידנית בלבד (workflow_dispatch); החזרת הקדנס = קומיט אחד.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dex-beat
  cancel-in-progress: false

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout the chain
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 ACTIONS-LOCK 2026-11-14
      - name: Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2 ACTIONS-LOCK 2026-11-14
        with:
          bun-version: latest

      - name: Cache bun install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4 ACTIONS-LOCK 2026-11-14
        with:
          path: ~/.bun/install/cache
          key: bun-dex-${{ hashFiles('bun.lock') }}
          restore-keys: bun-dex-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Prisma client
        run: bunx prisma generate

      - name: Prisma schema push (Roast-65 fix — BlockHeader table must exist on the fresh runner DB before the engine boots)
        run: bunx prisma db push --skip-generate --accept-data-loss
        env:
          DATABASE_URL: file:${{ github.workspace }}/db/dex.db

      - name: Beat (advance chain, verify claims, credit, publish)
        env:
          DATABASE_URL: file:${{ github.workspace }}/db/dex.db
          CLOUD_TICKS: '480'
          CONSOLE_TOKEN: ${{ secrets.CONSOLE_PUSH_TOKEN }}
        run: bun run cloud-beat.ts
