# unlock-rails.yml — פתיחת-כל-המסילות-החסומות בפקודת-הבעלים (trace 1a1f54843cc87f65):
# «יש מפתחות פתח כל מה שחסום יש בכל וייעל הכל יותר וודא דחיפה לגיט»
# 1. census-generic (הסקר-המוכח) → LIVE_MAP מדיד מול-השרשרת
# 2. fleet-claim: claims-פנדינג-של-הצי + sweep-נזיל-מדוד ל-headcorner (דלק-מנוע)
# 3. hive-vote: קורצרציה-אמיתית-על-hive (מטבע-שני)
# 4. blurt-treasury: סריקה+claim על-blurt (מטבע-שלישי)
# 5. se-scan: מלאי-Steem-Engine (קריאה-בלבד)
# אפס-סודות-בפלט: רק-fingerprints+txids+שמות+סכומים · fail-closed לכל-שלב.
name: unlock-rails
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      sweep:
        description: "sweep fleet liquid to headcorner (true/false)"
        required: false
        default: "true"
permissions:
  contents: read
concurrency:
  group: unlock-rails
  cancel-in-progress: false
jobs:
  unlock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 ACTIONS-LOCK 2026-11-14
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2 ACTIONS-LOCK 2026-11-14
        with:
          bun-version: 1.3.14
      - name: install deps (frozen + noble for census)
        run: |
          bun install --frozen-lockfile
          npm i --no-save --silent @noble/secp256k1@2.2.3 @noble/hashes@1.8.0 @hiveio/dhive@1.3.6
      - name: census — generic scan, chain is the judge
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          STEEM_ACTIVE_WIF: ${{ secrets.STEEM_ACTIVE_WIF }}
          STEEM_POSTING_WIF: ${{ secrets.STEEM_POSTING_WIF }}
          HIVE_ACTIVE_WIF: ${{ secrets.HIVE_ACTIVE_WIF }}
          HIVE_POSTING_WIF: ${{ secrets.HIVE_POSTING_WIF }}
          BLURT_ACTIVE_WIF: ${{ secrets.BLURT_ACTIVE_WIF }}
          BLURT_POSTING_WIF: ${{ secrets.BLURT_POSTING_WIF }}
          SA_HEAD_ACTIVE: ${{ secrets.SA_HEAD_ACTIVE }}
          SA_FLEET_KEYS: ${{ secrets.SA_FLEET_KEYS }}
          LIVE_FLEET_KEYS: ${{ secrets.LIVE_FLEET_KEYS }}
          ROT2_FLEET_KEYS: ${{ secrets.ROT2_FLEET_KEYS }}
          ROT_ROSTER: ${{ secrets.ROT_ROSTER }}
          CI_ADOPT_WIF_ACTIVE: ${{ secrets.CI_ADOPT_WIF_ACTIVE }}
          CI_ADOPT_WIF_POSTING: ${{ secrets.CI_ADOPT_WIF_POSTING }}
          SAOS_RELAY_WIF: ${{ secrets.SAOS_RELAY_WIF }}
          SAOS_TREASURY_WIF: ${{ secrets.SAOS_TREASURY_WIF }}
          WEAVE_STEEM_WIF: ${{ secrets.WEAVE_STEEM_WIF }}
          WEAVE_HIVE_WIF: ${{ secrets.WEAVE_HIVE_WIF }}
          MAIN_KEY: ${{ secrets.MAIN_KEY }}
          FLEET_ACCOUNT: ${{ secrets.FLEET_ACCOUNT }}
          FLEET_ROSTER_MAP: ${{ secrets.FLEET_ROSTER_MAP }}
        run: |
          set -Euo pipefail
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node ops/custody-census/census-all.mjs 2>&1 | tee /tmp/census.out
          grep "LIVE_MAP_B64" /tmp/census.out | sed 's/^LIVE_MAP_B64://; s/:END$//' | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{process.stdout.write(Buffer.from(d.trim(),"base64").toString())})' > /tmp/live-map.json
          node -e 'const m=JSON.parse(require("fs").readFileSync("/tmp/live-map.json","utf8"));console.log("live-map accounts:",Object.keys(m).length)'
      - name: fleet-cancel (stale orders → free float)
        run: bun scripts/unlock/fleet-cancel.mjs
        continue-on-error: true
      - name: fleet-claim + sweep-all
        env:
          LIVE_FLEET_KEYS: ${{ secrets.LIVE_FLEET_KEYS }}
          ROT2_FLEET_KEYS: ${{ secrets.ROT2_FLEET_KEYS }}
          STEEM_ACTIVE_WIF: ${{ secrets.STEEM_ACTIVE_WIF }}
          STEEM_POSTING_WIF: ${{ secrets.STEEM_POSTING_WIF }}
          SWEEP: ${{ inputs.sweep }}
          SWEEP_KEEP: ""
        run: bun scripts/unlock/fleet-claim.mjs
        continue-on-error: true
      - name: fleet-post performers delegate-post-vote
        env:
          STEEM_ACTIVE_WIF: ${{ secrets.STEEM_ACTIVE_WIF }}
        run: bun scripts/unlock/fleet-post.mjs
        continue-on-error: true
      - name: hive-vote
        env:
          HIVE_ACTIVE_WIF: ${{ secrets.HIVE_ACTIVE_WIF }}
          HIVE_POSTING_WIF: ${{ secrets.HIVE_POSTING_WIF }}
          HIVE_ACCOUNT: headcorner
          HIVE_VOTE_LIMIT: "4"
        run: bun scripts/unlock/hive-vote.mjs
        continue-on-error: true
      - name: "hive-maker dust quotes rail"
        env:
          HIVE_ACTIVE_WIF: ${{ secrets.HIVE_ACTIVE_WIF }}
          HIVE_ACCOUNT: headcorner
        run: bun scripts/unlock/hive-maker.mjs
        continue-on-error: true
      - name: "hive-savings hbd interest rail"
        env:
          HIVE_ACTIVE_WIF: ${{ secrets.HIVE_ACTIVE_WIF }}
          HIVE_ACCOUNT: headcorner
        run: bun scripts/unlock/hive-savings.mjs
        continue-on-error: true
      - name: blurt-treasury
        env:
          BLURT_ACTIVE_WIF: ${{ secrets.BLURT_ACTIVE_WIF }}
          BLURT_POSTING_WIF: ${{ secrets.BLURT_POSTING_WIF }}
        run: bun scripts/unlock/blurt-treasury.mjs
        continue-on-error: true
      - name: se-scan
        run: bun scripts/unlock/se-scan.mjs
        continue-on-error: true
