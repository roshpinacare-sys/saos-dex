# ARB-SCAN — סורק-הארביטרז'-החוצה-וניוז של הצי · ריבוני (אפס-Actions-צד-ג · אפס-סודות)
# =============================================================================
# Z-87a · מסגרת-השוק של הסוכנים (audit-Z86c פער-c): הרווחיות מוכחת בקבלות-נייר
# מצטברות (grids/state/arb-ledger.json — arb-ledger-v1) לפני-שמישהו מחמש ביצוע.
# · אין actions/checkout — שכפול-native עם git (טוקן-מובנה) — אותו-דפוס-בית של llm-bridge;
# · keyless לגמרי: כל-הפידים ציבוריים (condenser/HTX/Binance/Engine/llama/coingecko/blurt);
# · feed-שנכשל → רשומת-דילוג כנה בפנקס (fail-closed) — הסריקה לעולם לא נופלת;
# · PLAN/SCAN-ONLY: המודולים מציעים, לא חותמים — אף-שער-חתימה לא קיים בקו-הזה;
# · דקות-קרון נקיות-במפת-הדקות (Z-70): 24,54 — אין-התנגשות עם אף-מכונה בצי.
# הקבלה נקבעת-על-ידי-ה-CI עצמו לריפו — commit = קבלה-חיצונית (חוק-אמת Z-85).

name: arb-scan

on:
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: arb-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: sovereign-clone (git native — אפס-תלות)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git config user.name "arb-scan-bot"
          git config user.email "noreply@agents.roshpinacare-sys"

      # Z-89 FIX (ריצה #37201710735: ERR_MODULE_NOT_FOUND 'bs58' — mover.mjs
      # יובא-בקו-ישר על-ידי arb-selftest והוא תלוי bs58/noble/steem מתוך
      # package.json). אותו-דפוס-בית-מוכח של dex-grid.yml (#22 ירוק):
      # bun + install מוקפא-לוקפייל לפני-כל-ריצת node.
      - name: bun (זהה ל-dex-grid — תבנית-מוכחת)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install (frozen-lockfile — לפני-שער-הברזל)
        run: |
          set -euo pipefail
          cd repo
          bun install --frozen-lockfile

      - name: selftest (שער-ברזל — תמיד ראשון, אפס-רשת)
        run: |
          set -euo pipefail
          cd repo
          node grids/arb-selftest.mjs

      - name: keyless-scan (סריקה-חיה → פנקס-מצטבר · continue-on-error כן)
        continue-on-error: true
        run: |
          set -euo pipefail
          cd repo
          node grids/arb-scan.mjs || echo "scan degraded honestly — ledger keeps its fail-closed state"

      - name: custody-receipt (Z-89 — מדידת-חזקות-רב-שרשרת, keyless · continue-on-error כן)
        continue-on-error: true
        run: |
          set -euo pipefail
          cd repo
          node grids/custody.mjs || echo "custody degraded honestly — receipt keeps its fail-closed state"

      # Z-90-c: הנקודה-החלופית להיסטוריית-עברות-ה-Engine (מנפיק-חתום-על-Hive + ספרי-גשר-בלרט)
      - name: engine-transfers-receipt (Z-90-c — היסטוריית-העברות-החלופית, keyless · continue-on-error כן)
        continue-on-error: true
        run: |
          set -euo pipefail
          cd repo
          node grids/engine-transfers.mjs || echo "engine-transfers degraded honestly — receipt keeps its fail-closed state"

      # Z-90-c: קבלת-הדוקטרינה-לתשלום — בונה-מראש את-החלטות-הבשלות מהקבלות-הטריות (custody שנכתב זה-עתה)
      - name: payout-doctrine-receipt (Z-90-c — החלטות-הבשלות-מראש, keyless · continue-on-error כן)
        continue-on-error: true
        run: |
          set -euo pipefail
          cd repo
          node grids/payout-doctrine.mjs || echo "payout-doctrine degraded honestly — receipt keeps its fail-closed state"

      - name: scan-summary (שמות-מדידה בלבד — אף-סוד לא קיים בקו-הזה)
        if: always()
        run: |
          set -euo pipefail
          cd repo
          node -e '
            const fs = require("fs");
            try {
              const l = JSON.parse(fs.readFileSync("grids/state/arb-ledger.json", "utf8"));
              const live = (l.entries ?? []).filter((e) => !e.degraded);
              const best = live.filter((e) => typeof e.edgeBps === "number").sort((a, b) => b.edgeBps - a.edgeBps)[0];
              console.log(JSON.stringify({
                schema: l.schema, generatedAt: l.generatedAt,
                entriesInFile: (l.entries ?? []).length, degradedInFile: (l.entries ?? []).length - live.length,
                cumulative: l.cumulative,
                bestEdge: best ? { pair: best.pair, edgeBps: best.edgeBps, size: best.executableSize, realness: best.realness } : null,
                law: "scan-only receipts — execution stays owner-armed and gated",
              }, null, 2));
            } catch (e) { console.log("ledger unreadable (honest): " + String(e.message).slice(0, 80)); }
          '

      - name: commit-receipt (קומיט = קבלה-חיצונית — הפנקס המצטבר)
        if: always()
        run: |
          set -euo pipefail
          cd repo
          git add -A grids/state/arb-ledger.json grids/state/custody.json grids/state/engine-transfers.json grids/state/payout-doctrine.json
          if git diff --cached --quiet; then
            echo "ledger unchanged — nothing to commit"
          else
            CUM=$(node -e 'try{const l=require("./grids/state/arb-ledger.json");console.log(`${l.cumulative.paperPnlSbd}SBD/${l.cumulative.entries}e · strategy ${l.cumulative.strategyPnlSbd??0}SBD/${l.cumulative.strategyEntries??0}e`)}catch(e){console.log("unreadable")}')
            # R25: try/catch מלא — הבאג-הישן (try בלי catch = SyntaxError) ייצר "best no-edge"
            # מזויף-בכל-ריצה. עתה: "no-edge" = באמת אין-קצה; "ledger-unreadable" = כשל-קריאה כנה.
            BEST=$(node -e 'try{const l=require("./grids/state/arb-ledger.json");const v=(l.entries||[]).filter(e=>!e.degraded&&typeof e.edgeBps==="number").sort((a,b)=>b.edgeBps-a.edgeBps)[0];console.log(v?`${v.edgeBps}bps ${v.pair}`:"no-edge")}catch(e){console.log("ledger-unreadable")}')
            git commit -m "arb-scan: paper-pnl ledger $(date -u +%FT%TZ) · cumulative ${CUM} · best ${BEST} [skip ci]"
            git push
          fi
