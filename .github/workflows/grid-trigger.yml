# GRID-TRIGGER — פעימת רשת-הטריגרים (fleet-2-d)
# דבר-גורר-דבר: כל 30 דק' — מדידת-אמת (RPC ציבורי + דוח-עיגון), טיק-דטרמיניסטי,
# פרסום-מצב. חסר-מפתחות מהיסוד (דוקטרינת R83) — מודד ומפרסם, לא חותם.
name: grid-trigger

on:
  # R75 (2026-09-30, ריבונות המכסה): הקדנס הדו-חצאייתי הוסר — התאום הציבורי
  # ב-Domain (grid-trigger-twin :09/:39, דקות Actions בלתי-מוגבלות) הוא המכונה.
  # המקור הזה — גיבוי להזנקה ידנית בלבד; החזרת הקדנס = קומיט אחד.
  # נמדד: הקרונות הפרטיים שנותרו היו שורפים ~1,440 דק'-Actions בחודש על
  # מכסה שאזולה — כלומר כשלון יומי טהור במקום מדידה.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: grid-trigger
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # T-B (owner directive 2026-10-05, trace 1a10bfe1342b2391): השער-המודע-מסילות
      # מפרסם את-מצב-הבלם ואת-המסילות-הפתוחות בגלוי. אין-כאן-שום-צעד-חתימה:
      # run.mjs = טיק-סימולציה (µ-sim, אפס-מפתחות) ו-peg.mjs = תוכנית-בלבד —
      # מסילות-מדידה שממשיכות-לרוץ גם-תחת STASIS (אותו-חוק של הסקופ ב-STASIS.json).
      # המסילות-ההון (grid/claims/general) נפרסמות-כאן רק-כאמת-מצב; החתימה עצמה
      # חיה ב-dex-grid.yml ונשלטת-שם על-ידי השער + הבלם-בזמן-חתימה (brake.mjs).
      - name: STASIS state (lane-aware report — this workflow signs nothing, measurement continues)
        id: brake
        run: |
          set -eu
          S=$(node -e "const s=JSON.parse(require('fs').readFileSync('grids/state/STASIS.json','utf8'));const lanes=(Array.isArray(s.stagedLanes&&s.stagedLanes.allow)?s.stagedLanes.allow:[]).join(',');console.log([s.active===true?'true':'false',String(s.mode||'full'),lanes||'none'].join(' '))")
          ACTIVE=$(echo "$S" | cut -d' ' -f1); MODE=$(echo "$S" | cut -d' ' -f2); LANES=$(echo "$S" | cut -d' ' -f3)
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "staged_lanes=$LANES" >> "$GITHUB_OUTPUT"
          echo "STASIS report · active=$ACTIVE · mode=$MODE · stagedLanes.allow=[$LANES] · grid lane: $([ "$MODE" = "staged" ] && echo ",$LANES," | grep -q ',grid,' && echo STAGED-ALLOW || echo halted) · claims lane: $([ "$MODE" = "staged" ] && echo ",$LANES," | grep -q ',claims,' && echo STAGED-ALLOW || echo halted) · this tick is measurement-only (no signing) — continues under STASIS"

      - name: tick
        run: node grids/run.mjs
        continue-on-error: false
      - name: peg offer (B-1/B-3 — internal grid params -> external offer)
        run: node grids/peg.mjs
        continue-on-error: true # ההצעה לא מפילה את הטיק — חסימה-כנה מתפרסמת כ-offer.json
      - name: publish heartbeat
        run: |
          set -u
          git config user.name "grid-trigger[bot]"
          git config user.email "grid-trigger[bot]@agents.roshpinacare-sys"
          git add grids/state/state.json 2>/dev/null || true
          git add grids/state/offer.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no state change — clean exit"
          else
            FEES="$(node -e 'const s=require("./grids/state/state.json");console.log(s.feeMeter?.simMu?.toFixed(1)||0)' 2>/dev/null || echo 0)"
            N="$(node -e 'const s=require("./grids/state/state.json");console.log(s.runCount||0)' 2>/dev/null || echo 0)"
            V="$(node -e 'const o=require("./grids/state/offer.json");console.log(o.verdict||"?")' 2>/dev/null || echo no-offer)"
            git commit -m "grid-heartbeat: tick#${N} · fees +${FEES}µ(sim) · peg=${V} [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
