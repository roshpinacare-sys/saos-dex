# hive-heartbeat — treasury custody on HIVE, executed fail-closed.
# Owner order 2026-10-17: "יש מפתחות שhive לא בדקת מספיק ... תמשיך ודחוף"
# + standing treasury-signing authorization ("אתה יכול לחתום בקופה").
# The runner holds HIVE_POSTING_WIF as a GitHub secret (write-only, never
# readable). The job: derive pub → verify == LIVE chain posting authority
# (fail-closed) → sign ONE posting-only custom_json heartbeat (zero value) →
# emit the SIGNED tx (public material) as an artifact for our own public relay
# to transport. The secret itself never leaves the runner; the chain is judge.
name: hive-heartbeat
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hive-heartbeat
  cancel-in-progress: false
jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: verify custody + sign heartbeat (secret never printed)
        env:
          HIVE_POSTING_WIF: ${{ secrets.HIVE_POSTING_WIF }}
          HIVE_ACTIVE_WIF: ${{ secrets.HIVE_ACTIVE_WIF }}
        run: bun scripts/hive-heartbeat-sign.ts
      - name: emit signed tx (public material only)
        # [wave 19.54 · trace 1a15e3e419138aa5] KNOWN-WOUND law: the sign step may
        # end green with a loud KNOWN-WOUND verdict (registered custody wound,
        # docs/hive-custody-wound.json) and no artifact — gate the emit/upload on
        # the artifact actually existing, or the green verdict would red again.
        if: hashFiles('signed-tx.b64') != ''
        run: |
          echo "signature-artifact-bytes: $(wc -c < signed-tx.b64)"
      - uses: actions/upload-artifact@v4
        if: hashFiles('signed-tx.b64') != ''
        with:
          name: signed-tx
          path: signed-tx.b64
          retention-days: 3
